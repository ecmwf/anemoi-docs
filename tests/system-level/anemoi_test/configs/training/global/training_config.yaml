defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation
- system: example
- graph: multi_scale
- model: graphtransformer
- task: forecaster
- training: single
- _self_

config_validation: True

system:
  input:
    dataset: ${system.input.root}/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    graph: null
    truncation: null
    truncation_inv: null
    root: "dummy_root" # will be replaced by the actual root in the system-level test suite
  hardware:
    accelerator: auto
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  output:
    root: "dummy_root" # will be replaced by the actual root in the system-level test suite

dataloader:
  training:
    datasets:
      data:
        end: 2017-01-08 12:00:00
  validation:
    datasets:
      data:
        start: 2017-01-08 18:00:00
  num_workers:
    training: 2
    validation: 2
  batch_size:
    training: 3
    validation: 3
  limit_batches:
    training: 3
    validation: 3

task:
  validation_rollout: 2
  multistep_input: 3
  multistep_output: 2

diagnostics:
  callbacks:
    - _target_: anemoi.training.diagnostics.callbacks.evaluation.RolloutEval
      rollout: [1, 2]
      every_n_batches: 4
  log:
    mlflow:
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      enabled: False
      tracking_uri: null # override '???'
  plot:
    callbacks: []


graph:
  overwrite: True

model:
  num_channels: 16
  processor:
    num_layers: 2
    num_chunks: 2

training:
  max_epochs: 2
  optimization:
    lr: 10e-5
    lr_scheduler:
      warmup_t: 1
  scalers:
    datasets:
      data:
        output_steps:
          _target_: anemoi.training.losses.scalers.TimeStepScaler
          norm: "unit-sum"
          weights: [1.0, 2.0]
  training_loss:
    datasets:
      data:
        scalers: ["pressure_level", "general_variable", "node_weights", "output_steps"]

data:
  datasets:
    data:
      processors:
        const_imputer:
          _target_: anemoi.models.preprocessing.imputer.ConstantImputer
          config:
            default: "none"
            0:
              - 2t
