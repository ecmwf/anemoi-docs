defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation
- system: example
- graph: limited_area
- model: graphtransformer
- task: forecaster
- training: lam
- _self_

config_validation: True

dataloader:
  dataset:
    cutout:
      - dataset: ${system.input.dataset}
        thinning: 25
      - dataset: ${system.input.forcing_dataset}
    adjust: all
    min_distance_km: 0
    max_distance_km: 300
  training:
    datasets:
      data:
        start: "2017-01-01"
        end: "2017-01-07"
  validation:
    datasets:
      data:
        start: "2017-01-08"
        end: "2017-01-10"
  num_workers:
    training: 2
    validation: 2
  batch_size:
    training: 3
    validation: 3
  limit_batches:
    training: 3
    validation: 3

model:
  num_channels: 16
  processor:
    num_layers: 2
    num_chunks: 2
  output_mask:
    datasets:
      data:
        _target_: anemoi.training.utils.masks.Boolean1DMask
        attribute_name: cutout_mask

system:
  input:
    dataset: ${system.input.root}/cerra-rr-an-oper-0001-mars-5p5km-2017-2017-6h-v3-testing.zarr
    forcing_dataset: ${system.input.root}/aifs-ea-an-oper-0001-mars-o96-2017-2017-6h-v8-testing.zarr
    root: dummy_root # will be replaced by the actual root in the system-level test suite
    graph: null
    truncation: null
    truncation_inv: null
  hardware:
    accelerator: auto
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  output:
    root: dummy_root # will be replaced by the actual root in the system-level test suite

data:
  datasets:
    data:
      forcing:
      - "cos_latitude"
      - "cos_longitude"
      - "sin_latitude"
      - "sin_longitude"
      - "cos_julian_day"
      - "cos_local_time"
      - "sin_julian_day"
      - "sin_local_time"
      diagnostic:
      - "tp"

      processors:
        normalizer:
          config:
            default: "mean-std"
            std:
            - "tp"
            min-max:
            max:
            none:
            - "cos_latitude"
            - "cos_longitude"
            - "sin_latitude"
            - "sin_longitude"
            - "cos_julian_day"
            - "cos_local_time"
            - "sin_julian_day"
            - "sin_local_time"

task:
  validation_rollout: 2

diagnostics:
  callbacks:
    - _target_: anemoi.training.diagnostics.callbacks.evaluation.RolloutEval
      rollout: [1, 2]
      every_n_batches: 4
  log:
    mlflow:
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      enabled: False
      tracking_uri: null
  plot:
    callbacks: []

graph:
  overwrite: True

training:
  max_epochs: 2
  optimization:
    lr: 10e-5
    lr_scheduler:
      warmup_t: 1
